name: VOLTRA web build
on:
  push:
    branches:
      - layero-disable-build-checker
    paths:
      - "web/**"
      - "layero.json"
      - ".github/workflows/check-web-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - "layero.json"
      - ".github/workflows/check-web-build.yml"
jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check build script syntax
        run: bash -n web/build.sh
      - name: Build the patched VOLTRA Web client
        run: bash web/build.sh
