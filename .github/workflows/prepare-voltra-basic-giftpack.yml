name: Prepare VOLTRA basic gift pack

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-voltra-basic-giftpack.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VOLTRA repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Export reference Grind Pack
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/owpengram/owpengram-giftpacks.git /tmp/owpengram-giftpacks
          cd /tmp/owpengram-giftpacks
          go run ./cmd/giftpack-export -o /tmp/raw-packs grind-pack

      - name: Build a basic, non-random VOLTRA subset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, zipfile, pathlib, shutil

          repo = pathlib.Path('/tmp/owpengram-giftpacks')
          raw = pathlib.Path('/tmp/raw-packs/grind-pack.zip')
          output = pathlib.Path('/tmp/voltra-basic-gifts.zip')
          selected_slugs = {'coffee', 'cake', 'giftbox'}
          allowed_fields = {
              'id_slug', 'title', 'stars', 'convert_stars',
              'base_animation', 'birthday'
          }

          with zipfile.ZipFile(raw, 'r') as source:
              names = set(source.namelist())
              if 'pack.json' not in names:
                  raise SystemExit('Exporter ZIP is missing root pack.json')
              manifest = json.loads(source.read('pack.json'))
              gifts = manifest.get('gifts', [])
              chosen = [g for g in gifts if g.get('id_slug') in selected_slugs]
              if {g.get('id_slug') for g in chosen} != selected_slugs:
                  raise SystemExit('Expected three basic gifts were not all found')
              if len(chosen) != 3:
                  raise SystemExit('Unexpected duplicate or missing basic gift')
              used_assets = set()
              clean_gifts = []
              for gift in chosen:
                  if gift.get('auction') or gift.get('upgrade') or gift.get('limited') or gift.get('limited_per_user'):
                      raise SystemExit('Refusing to include auction, random-upgrade, or limited gift')
                  animation = gift.get('base_animation')
                  if not animation or animation not in names:
                      raise SystemExit('Missing animation asset: ' + str(animation))
                  used_assets.add(animation)
                  clean = {k: v for k, v in gift.items() if k in allowed_fields}
                  clean.setdefault('convert_stars', 0)
                  clean_gifts.append(clean)

              # gramsrv's strict parser accepts only pack_name, author and gifts.
              clean_manifest = {
                  'pack_name': 'VOLTRA Basics',
                  'author': 'OwpenGram (selected pack adapted for VOLTRA)',
                  'gifts': clean_gifts,
              }

              with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as target:
                  target.writestr('pack.json', json.dumps(clean_manifest, ensure_ascii=False, indent=2) + '\\n')
                  for asset in sorted(used_assets):
                      target.writestr(asset, source.read(asset))
                  target.write(repo / 'LICENSE', 'LICENSE')
                  notice = repo / 'README.md'
                  target.writestr('SOURCE-NOTICE.txt',
                      'Gift animations and pack design subset adapted from owpengram/owpengram-giftpacks.\\n'
                      'Original repository license: Apache License 2.0 (see LICENSE).\\n'
                      'VOLTRA pack contains only the fixed-price basic gifts; auction and random-upgrade items were excluded.\\n')

          with zipfile.ZipFile(output) as check:
              bad = check.testzip()
              if bad:
                  raise SystemExit('ZIP CRC check failed: ' + bad)
              data = json.loads(check.read('pack.json'))
              print('ZIP:', output, output.stat().st_size, 'bytes')
              print('Gifts:', ', '.join(g['title'] for g in data['gifts']))
              print('Assets:', [n for n in check.namelist() if n.endswith(('.tgs', '.json', '.lottie'))])
              print('Entries:', check.namelist())
          PY

      - name: Upload prepared gift pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltra-basic-gifts
          path: /tmp/voltra-basic-gifts.zip
          if-no-files-found: error
          retention-days: 7
